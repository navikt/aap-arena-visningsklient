name: Build PR
on:
  workflow_dispatch:
  pull_request:
    
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build docker image
        uses: nais/docker-build-push@main
        id: docker-build
        with:
          target: runtime
          team: aap
          build_secrets: NPM_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
          push_image: false
