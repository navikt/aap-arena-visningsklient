name: Build & Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build and push docker image to GAR
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          target: runtime
          team: aap
          build_secrets: NPM_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
      - name: Deploy to nais (dev)
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
          RESOURCE: .nais/nais.yaml
          VARS: .nais/dev.yaml
      - name: Deploy to nais (prod)
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
          RESOURCE: .nais/nais.yaml
          VARS: .nais/prod.yaml